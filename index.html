    "Confirm both signals: interface error counter AND syslog/IPFIX drop.",
    "Check NetBox for the circuit ID, carrier, and maintenance window.",
    "If a carrier window is open, annotate — do not ticket.",
    "If not, open the carrier portal with the circuit ID from NetBox, not from memory.",
    "Escalate per the ladder. Do not bounce the interface without an approved plan."
  ];
  const STARTERS = [
    "Why is source of truth not discovery?",
    "What would you do about the stale cloud-vpc feed?",
    "Draft a check-mode plan to align core-rtr-b1 OS with intent.",
    "Explain the dual-signal gate with the WAN loss example."
  ];

  function driftOf(d){
    const f=[];
    const intendedOs = (state.writeDiscovery && d.id==="r2") ? d.actualOs : d.intendedOs;
    if(intendedOs!==d.actualOs) f.push(["OS", intendedOs, d.actualOs]);
    if(d.intendedAsn!==d.actualAsn) f.push(["ASN", d.intendedAsn, d.actualAsn]);
    if(d.intendedCircuits!==d.actualCircuits) f.push(["Circuits", String(d.intendedCircuits), String(d.actualCircuits)]);
    return f;
  }
  function age(s){
    s=Math.max(0, Math.floor(s));
    if(s<60) return s+"s";
    if(s<3600) return Math.floor(s/60)+"m";
    if(s<86400) return Math.floor(s/3600)+"h";
    return Math.floor(s/86400)+"d";
  }
  function esc(t){
    return String(t).replace(/[&<>"']/g, function(c){
      if(c==="&") return "\u0026amp;";
      if(c==="<") return "\u0026lt;";
      if(c===">") return "\u0026gt;";
      if(c==='"') return "\u0026quot;";
      return "\u0026#39;";
    });
  }
  function health(id){
    const spec = COLLECTORS.find(c=>c.id===id);
    const rt = state.collectors[id];
    if(!spec || !rt || rt.killed) return "crit";
    if(rt.ageSec > spec.sloSec) return "crit";
    if(rt.ageSec > spec.sloSec * 0.6) return "warn";
    return "ok";
  }
  function summary(){
    let ok=0,warn=0,crit=0;
    COLLECTORS.forEach(c => {
      const h=health(c.id);
      if(h==="ok") ok++; else if(h==="warn") warn++; else crit++;
    });
    return {ok,warn,crit, live: COLLECTORS.length-crit, pct: Math.round(ok/COLLECTORS.length*100)};
  }

  let seq=1;
  const state = {
    route: "/",
    stage: "sources",
    selected: "vpc",
    filter: "drift",
    writeDiscovery: false,
    metric: false,
    log: false,
    plans: [],
    messages: [{role:"plane", text:"Read-only control plane. I can see every feed, NetBox intent, and the drift list. I cannot change a device, restart a collector, or write the source of truth. Ask, or have me draft a plan."}],
    events: [
      {id:"e0", level:"crit", source:"cloud-vpc", text:"Freshness SLO breached — last beat 3h 17m ago"},
      {id:"e1", level:"warn", source:"core-rtr-b1", text:"OS drift vs NetBox intent (IOS-XR 7.9.1 ≠ 7.11.2)"},
      {id:"e2", level:"ok", source:"gnmi-core", text:"gNMI subscription healthy, 12 paths"},
      {id:"e3", level:"warn", source:"br27-sw-01", text:"Undocumented circuit present — discovery ≠ intent"}
    ],
    collectors: {},
    ask: "",
    busy: false
  };
  COLLECTORS.forEach(c => {
    const stale = c.id==="vpc";
    state.collectors[c.id] = {ageSec: stale ? 11840 : (c.cadence==="stream"?6:54), killed:false, ingest: c.cadence==="stream"?196:28};
  });

  function pushEvent(level, source, text){
    state.events = [{id:"k"+(seq++), level, source, text}, ...state.events].slice(0,24);
  }

  function tick(){
    COLLECTORS.forEach(c => {
      const rt = state.collectors[c.id];
      if(rt.killed || c.id==="vpc"){
        rt.ageSec += 2;
        rt.ingest = Math.max(0, rt.ingest * 0.4);
      } else {
        const reset = c.cadence==="stream" ? rt.ageSec > 12 : rt.ageSec > 70 + Math.random()*40;
        rt.ageSec = reset ? 1 + Math.random()*4 : rt.ageSec + 2;
        rt.ingest = Math.max(8, rt.ingest + (Math.random()-0.45)*6);
      }
    });
    patchLive();
  }

  function routeFromHash(){
    const h = (location.hash || "#/").replace(/^#/, "") || "/";
    const path = h.split("?")[0] || "/";
    state.route = path.startsWith("/") ? path : "/"+path;
    const q = new URLSearchParams(h.split("?")[1] || "");
    if(q.get("stage") && STAGES.some(s=>s.id===q.get("stage"))) state.stage = q.get("stage");
  }

  function go(to){
    location.hash = to;
  }

  function navHtml(){
    return NAV.map(([to,label]) => {
      const on = to==="/" ? state.route==="/" : state.route.startsWith(to);
      return `<a href="#${to}" data-nav="${to}" class="${on?"on":""}">${label}</a>`;
    }).join("");
  }

  function localAnswer(prompt){
    const q = prompt.toLowerCase();
    if(/source of truth|discovery|netbox/.test(q)){
      return "NetBox is intended state: what should exist. Collectors report actual state: what is running.\n\nIf you write discovery into NetBox you document mistakes as policy. Drift is a measured gap, not a merge.\n\nI can show you the drifted objects. I will not update NetBox.";
    }
    if(/stale|cloud-vpc|fresh/.test(q)){
      return "cloud-vpc is stale — last beat well past its 15m SLO. Treat every VPC graph as untrusted until the heartbeat recovers.\n\nSilence is a failure state. Page the named owner (cloud-net) using the collector-stale runbook. Do not tight-loop the cloud API.\n\nI cannot restart the collector. Approve a plan if you want a human to revive the unit from the git-tracked systemd file.";
    }
    if(/core-rtr-b1|plan|check-mode|\bos\b/.test(q)){
      return "PLAN\ntitle: Align core-rtr-b1 IOS-XR with NetBox intent 7.11.2\ncheck-mode: show version + compute delta against intended image; no write\ncanary: core-rtr-b1 only, confirmed-commit with 10m watch\nrollback: ISSU / install rollback to 7.9.1, recorded in the audit log\nrisk: control-plane SSO event on a P router — do not fleet this\n\nI will not execute this. A human approves, then a human (or gated automation) runs it.";
    }
    if(/dual|alert|wan/.test(q)){
      return "The dual-signal gate exists because a single counter lies.\n\nWAN loss example: interface error-delta AND syslog/IPFIX drop must both fire. One alone is a yellow, not a page.\n\nIf people mute the channel, the architecture has already failed. Keep the gate strict.";
    }
    const feeds = COLLECTORS.map(c => {
      const rt = state.collectors[c.id];
      return `${c.name} ${health(c.id)} age=${age(rt.ageSec)} owner=${c.owner}`;
    }).join("\n");
    const drifted = DEVICES.filter(d => driftOf(d).length).map(d => d.hostname+" "+driftOf(d).map(f=>f[0]+":"+f[1]+"->"+f[2]).join(",")).join("\n");
    return "Read-only control plane. I can explain the estate, score drift, and draft plans. I cannot change devices.\n\nCOLLECTORS\n"+feeds+"\n\nDRIFT\n"+(drifted||"none")+"\n\nAsk about freshness, drift, dual-signal, or a specific hostname.";
  }

  function ask(prompt){
    const text = (prompt||"").trim();
    if(!text || state.busy) return;
    state.busy = true;
    state.ask = "";
    state.messages.push({role:"operator", text});
    render();
    const reply = localAnswer(text);
    state.messages.push({role:"plane", text: reply, source:"local"});
    if(reply.indexOf("PLAN")>=0 && /title:\s*/i.test(reply)){
      const title = (reply.match(/title:\s*(.+)/i)||[])[1] || "Drafted change plan";
      state.plans.unshift({id:"p"+(seq++), title: title.trim(), body: reply, status:"proposed"});
      state.plans = state.plans.slice(0,12);
    }
    state.busy = false;
    render();
  }

  function command(){
    const s = summary();
    const drifted = DEVICES.filter(d => driftOf(d).length);
    const dual = state.metric && state.log;
    return `
      <div class="eyebrow">Reference architecture · v2.0</div>
      <h1>Network Observability<br><span class="muted">Source of Truth</span></h1>
      <p class="lede">Vendor telemetry into an open-source stack. A source of truth that states what should exist. Drift measured against it. Automation that stays read-only until a human approves the change.</p>
      <div class="row">
        <span class="chip ok">Pages live</span>
        <span class="chip ok">v2.0 shipped</span>
        <span class="chip">2026-08-29</span>
        <span class="chip now">interactive</span>
      </div>
      <div class="row">
        <a class="btn" href="#/pipeline" data-nav="/pipeline">Walk the pipeline →</a>
        <a class="btn ghost" href="#/control-plane" data-nav="/control-plane">Open the control plane</a>
      </div>
      <div class="kpi">
        <div class="card"><div class="k">Collectors</div><div class="v ${s.crit?"crit":"ok"}" data-kpi="live">${s.live}/${COLLECTORS.length}</div><div class="hint">heartbeat-monitored</div></div>
        <div class="card"><div class="k">Stale feeds</div><div class="v ${s.crit?"crit":"ok"}" data-kpi="crit">${s.crit}</div><div class="hint">silence is a failure</div></div>
        <div class="card"><div class="k">Freshness</div><div class="v ${s.pct<80?"warn":"ok"}" data-kpi="pct">${s.pct}%</div><div class="hint">inside SLO</div></div>
        <div class="card"><div class="k">Drifted devices</div><div class="v ${drifted.length?"warn":"ok"}">${drifted.length}/${DEVICES.length}</div><div class="hint">intent ≠ actual</div></div>
      </div>
      <div class="cols5" style="margin-top:16px">
        ${STAGES.map(st => `<a class="stage-btn" href="#/pipeline" data-nav="/pipeline" data-stage="${st.id}"><div class="k">${st.step}</div><div style="margin-top:6px;font-weight:650">${st.name}</div></a>`).join("")}
      </div>
      <div class="grid2 grid5" style="margin-top:16px">
        <section class="panel">
          <div class="hd"><div><div class="k">Collectors</div><h2>Freshness heatmap</h2></div><a href="#/estate" data-nav="/estate">Estate</a></div>
          <ul class="list">${COLLECTORS.map(c => {
            const h = health(c.id); const rt = state.collectors[c.id];
            return `<li class="cell" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span style="display:flex;gap:8px;align-items:center;min-width:0"><span class="dot ${h}" data-health="${c.id}"></span><span class="mono" style="font-size:13px">${c.name}</span></span><span class="mono dim" data-age="${c.id}" style="font-size:12px">${age(rt.ageSec)}</span></li>`;
          }).join("")}</ul>
        </section>
        <section class="panel">
          <div class="hd"><div><div class="k">Source of truth</div><h2>Intent versus actual</h2></div><a href="#/drift" data-nav="/drift">Drift</a></div>
          <ul class="list">${drifted.slice(0,4).map(d => {
            const f = driftOf(d);
            return `<li class="cell"><div style="display:flex;justify-content:space-between;gap:8px"><span class="mono" style="font-size:13px">${d.hostname}</span><span class="chip warn">${f.length} field${f.length>1?"s":""}</span></div><p class="dim" style="font-size:12px;margin-top:4px">${f.map(x=>x[0]+": "+x[1]+" → "+x[2]).join(" · ")}</p></li>`;
          }).join("")}</ul>
          <p class="dim" style="font-size:12px;margin-top:10px">Discovery reports. NetBox is not updated from this list.</p>
        </section>
      </div>
      <div class="grid2 grid5" style="margin-top:12px">
        <section class="panel">
          <div class="k">Act</div><h2>Dual-signal gate</h2>
          <div class="list" style="margin-top:12px">
            <div class="cell" style="display:flex;justify-content:space-between"><span class="muted">Signal A · interface error-delta</span><span class="dot ${state.metric?"ok":""}"></span></div>
            <div class="cell" style="display:flex;justify-content:space-between"><span class="muted">Signal B · syslog / IPFIX drop</span><span class="dot ${state.log?"ok":""}"></span></div>
            <div class="cell"><div class="k">Page</div><div class="${dual?"crit":"muted"}" style="margin-top:4px">${dual?"Firing — both agree":"Held — one signal is not enough"}</div></div>
          </div>
          <p style="margin-top:12px"><a href="#/alerts" data-nav="/alerts">Open the alert lab</a></p>
        </section>
        <section class="panel">
          <div class="k">Live</div><h2>Event tape</h2>
          <ul class="list" style="margin-top:12px">${state.events.slice(0,5).map(e => `<li style="display:flex;gap:10px"><span class="dot ${e.level}" style="margin-top:7px"></span><div><div class="mono dim" style="font-size:11px">${esc(e.source)}</div><p class="muted" style="font-size:13px">${esc(e.text)}</p></div></li>`).join("")}</ul>
        </section>
      </div>
      <div class="tags">${TAGS.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    `;
  }

  function pipeline(){
    const current = STAGES.find(s=>s.id===state.stage) || STAGES[0];
    return `
      <div class="eyebrow">The pipeline</div>
      <h1>From vendor APIs to an on-call alert</h1>
      <p class="lede">Five stages. Every one of them read-only by default, scheduled on organization-owned hosts, and monitored for its own freshness — a dead feed raises an alert rather than going quiet.</p>
      <div class="cols5" style="margin-top:22px">
        ${STAGES.map(s => `<button class="stage-btn ${s.id===state.stage?"on":""}" type="button" data-stage="${s.id}"><div class="k">${s.step}</div><div style="margin-top:6px;font-weight:650">${s.name}</div></button>`).join("")}
      </div>
      <div class="grid2 grid5" style="margin-top:14px">
        <section class="panel">
          <div class="k">Stage ${current.step}</div><h2>${current.name}</h2>
          <div class="grid2" style="margin-top:14px">
            <div class="cell"><div class="k">v1 · published</div><p class="muted" style="margin-top:8px;font-size:14px">${current.v1}</p></div>
            <div class="cell"><div class="k">v2 <span class="chip now">this console</span></div><p class="muted" style="margin-top:8px;font-size:14px">${current.v2}</p></div>
          </div>
          <ul class="list" style="margin-top:12px;grid-template-columns:1fr 1fr">${current.items.map(it => `<li class="cell" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="muted">${it[0]}</span><span class="chip ${it[1]?"now":""}">${it[1]?"v2":"v1"}</span></li>`).join("")}</ul>
        </section>
        <section class="panel">
          <div class="k">Stores</div><h2>Four questions</h2>
          <dl style="margin-top:12px;display:grid;gap:12px;font-size:14px">
            <div><dt class="dim">What should exist?</dt><dd>NetBox — intent, IPAM, circuits</dd></div>
            <div><dt class="dim">How is it performing?</dt><dd>InfluxDB now · Mimir as the scale path</dd></div>
            <div><dt class="dim">What just happened?</dt><dd>Loki — estate-wide logs</dd></div>
            <div><dt class="dim">How did the job run?</dt><dd>Tempo — collector hops and change plans</dd></div>
          </dl>
        </section>
      </div>
      <h2 style="margin-top:36px">Three rules the whole thing is built on</h2>
      <p class="lede" style="margin-top:8px">A pipeline is easy. Keeping it trustworthy — and safe to point at production — is the part that takes judgement.</p>
      <div class="cols3" style="margin-top:16px">${PRINCIPLES.map(p => `<div class="panel"><div class="k accent">${p[0]}</div><h2 style="margin-top:8px">${p[1]}</h2><p class="muted" style="margin-top:10px;font-size:14px">${p[2]}</p></div>`).join("")}</div>
      <h2 style="margin-top:36px">The parts people usually get wrong</h2>
      <div class="grid2" style="margin-top:16px">${DECISIONS.map(d => `<div class="panel"><h2 style="font-size:16px">${d[0]}</h2><p class="muted" style="margin-top:8px;font-size:14px">${d[1]}</p></div>`).join("")}</div>
    `;
  }

  function estate(){
    const spec = COLLECTORS.find(c=>c.id===state.selected) || COLLECTORS[0];
    const rt = state.collectors[spec.id];
    const h = health(spec.id);
    const maxIn = Math.max(1, ...COLLECTORS.map(c => state.collectors[c.id].ingest));
    return `
      <div class="eyebrow">Estate</div>
      <h1>Collectors that admit when they die</h1>
      <p class="lede">Eight feeds, one per layer. No agent on a production device. Kill a collector and the heatmap goes red — silence is not treated as good news.</p>
      <div class="cols4" style="margin-top:22px">
        ${COLLECTORS.map(c => {
          const hh = health(c.id); const r = state.collectors[c.id];
          return `<button type="button" class="feed-btn ${c.id===spec.id?"on":""}" data-select="${c.id}">
            <div style="display:flex;justify-content:space-between"><span class="dot ${hh}" data-health="${c.id}"></span><span class="mono dim" data-age="${c.id}" style="font-size:12px">${age(r.ageSec)}</span></div>
            <div class="mono" style="margin-top:10px;font-size:13px">${c.name}</div>
            <div class="dim" style="margin-top:4px;font-size:12px">${c.protocol}</div>
          </button>`;
        }).join("")}
      </div>
      <div class="grid2 grid5" style="margin-top:14px">
        <section class="panel">
          <div class="k">${spec.layer}</div><h2>${spec.name}</h2>
          <div class="grid2" style="margin-top:12px">
            ${[["Protocol",spec.protocol],["Cadence",spec.cadence],["Owner",spec.owner],["Site",spec.site],["Freshness SLO",spec.sloSec+"s"],["Age",age(rt.ageSec)]].map(x=>`<div class="cell"><div class="k">${x[0]}</div><div class="mono" style="font-size:13px;margin-top:4px" ${x[0]==="Age"?'data-age="'+spec.id+'"':""}>${x[1]}</div></div>`).join("")}
          </div>
          <div class="row">
            <span class="chip ${h}">${h==="ok"?"inside SLO":h==="warn"?"aging":"stale / dead"}</span>

          </div>

        <section class="panel">
          <div class="k">Ingest</div><h2>Relative rate</h2>

            return `<div class="bar-row"><span class="dim">${c.name.split("-")[0]}</span><div class="bar"><i data-bar="${c.id}" style="width:${pct}%"></i></div><span class="mono dim" data-ing="${c.id}">${Math.round(state.collectors[c.id].ingest)}</span></div>`;
          }).join("")}</div>
        </section>

      <section class="panel" style="margin-top:12px">
        <div class="k">Topology</div><h2>Sites the collectors sit in</h2>
        <div class="cols4" style="margin-top:12px">${SITES.map(s => {

          return `<div class="cell"><div class="k">${s[2]}</div><div style="font-weight:650;margin-top:4px">${s[0]}</div><div class="dim" style="font-size:12px">${s[1]}</div><div style="margin-top:10px">${here.length?here.map(c=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin:3px 0"><span class="dot ${health(c.id)}" data-health="${c.id}"></span>${c.name}</div>`).join(""):`<span class="dim" style="font-size:12px">No collector hosted here</span>`}</div></div>`;
        }).join("")}</div>
      </section>
    `;
  }

  function drift(){
    const rows = DEVICES.map(d => ({d, f: driftOf(d)})).filter(r => state.filter==="all" ? true : r.f.length);
    const drifted = DEVICES.filter(d => driftOf(d).length);
    const intendedB1 = state.writeDiscovery ? "IOS-XR 7.9.1" : "IOS-XR 7.11.2";
    return `
      <div class="eyebrow">Source of truth</div>
      <h1>Intent versus actual</h1>
      <p class="lede">NetBox holds what the network is supposed to be. Collectors report what it is. The gap is measured. It is never written back.</p>
      <div class="grid2 grid5" style="margin-top:22px">
        <section class="panel">
          <div class="k">Estate</div><h2>${drifted.length} drifted / ${DEVICES.length} devices</h2>

                <td class="mono">${d.hostname}</td>

          <div class="cell" style="margin-top:12px;font-size:14px">${state.writeDiscovery
            ? `<p class="crit">core-rtr-b1 intended OS is now 7.9.1. The mistake is policy. Tomorrow's audit will bless it.</p>`

        </section>
      </div>
      <div class="grid2" style="margin-top:12px">${drifted.map(d => `<div class="panel">
        <div style="display:flex;justify-content:space-between;gap:10px"><div><div class="mono" style="font-size:13px">${d.hostname}</div><div class="dim" style="font-size:12px">${d.vendor} · ${d.site}</div></div><span class="chip warn">hardening ${d.hardening}</span></div>
        <ul class="list" style="margin-top:12px">${driftOf(d).map(f => `<li class="cell" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px"><span class="dim">${f[0]}</span><span class="muted">${f[1]}</span><span class="mono warn">${f[2]}</span></li>`).join("")}</ul>
      </div>`).join("")}</div>
    `;

  function alerts(){
    const firing = state.metric && state.log;
    const muted = state.metric !== state.log;
    return `
      <div class="eyebrow">Act</div>
      <h1>Alerts that survive contact with humans</h1>
      <p class="lede">An alert fires only when two independent signals agree. Flip each feed. A channel people mute is worse than no alerting at all.</p>
      <div class="grid2" style="margin-top:22px">
        <section class="panel">
          <div class="k">Signal A</div><h2>Interface error-delta</h2>
          <p class="muted" style="margin-top:8px;font-size:14px">InfluxDB counter on sdwan-hub-1 ge-0/0/0. Independent of logs.</p>
          <button class="btn ${state.metric?"":"ghost"}" type="button" data-metric style="margin-top:14px">${state.metric?"Metric firing":"Metric quiet"}</button>
        </section>
        <section class="panel">
          <div class="k">Signal B</div><h2>Syslog / IPFIX drop</h2>
          <p class="muted" style="margin-top:8px;font-size:14px">Loki line + flow-edge loss. Independent of the interface counter.</p>
          <button class="btn ${state.log?"":"ghost"}" type="button" data-log style="margin-top:14px">${state.log?"Log firing":"Log quiet"}</button>
        </section>
      </div>
      <section class="panel" style="margin-top:12px">
        <div class="hd"><div><div class="k">Gate</div><h2>${firing?"Page — both signals agree":"Held"}</h2></div><span class="chip ${firing?"crit":muted?"warn":"ok"}">${firing?"firing":"suppressed"}</span></div>
        <div class="cols3">
          ${[["A · metric", state.metric],["B · log/flow", state.log],["AND gate", firing]].map(x => `<div class="cell"><span class="dot ${x[1]?"ok":""}"></span> <span style="margin-left:6px">${x[0]}</span></div>`).join("")}
        </div>
        ${muted && !firing ? `<p class="warn" style="margin-top:14px;font-size:14px">One signal is hot. That is a yellow for the owner, not a page. Paging on a single counter is how channels die.</p>` : ""}
        ${firing ? `<div class="cell" style="margin-top:16px"><div class="k">Runbook</div><h2 style="margin-top:4px">WAN loss — dual signal</h2><ol class="muted" style="margin:10px 0 0 18px;font-size:14px">${WAN_RB.map(s=>`<li style="margin:4px 0">${s}</li>`).join("")}</ol></div>` : `<p class="dim" style="margin-top:14px;font-size:14px">No card is sent until the gate closes. The on-call channel stays quiet.</p>`}
      </section>
      <div class="grid2" style="margin-top:12px">
        <section class="panel"><div class="k">Also gated</div><h2>Collector death</h2><p class="muted" style="margin-top:8px;font-size:14px">Heartbeat miss plus missing ingest. One empty graph is not a page — the second signal is the missing beat file on the collector host.</p></section>
        <section class="panel"><div class="k">Never gated</div><h2>A dashboard going quiet</h2><p class="muted" style="margin-top:8px;font-size:14px">Quiet is how three-week-stale graphs happen. Freshness has its own SLO. It pages the collector owner, not the WAN on-call.</p></section>
      </div>
    `;
  }

  function plane(){
    return `
      <div class="eyebrow">AI control plane</div>
      <h1>Read anything, change nothing</h1>
      <p class="lede">A single agent reads the stack and answers in plain English. Writes execute only inside a human-approved plan, fully audit-logged. Stale feeds are disclosed.</p>
      <div class="grid2 grid5" style="margin-top:22px">
        <section class="panel">
          <div class="k">Session</div><h2>Operator channel</h2>
          <div id="chat" style="max-height:480px;overflow:auto;margin-top:8px">
            ${state.messages.map(m => `<div class="msg ${m.role==="operator"?"op":"pl"}"><div class="k" style="margin-bottom:4px">${m.role==="operator"?"Operator":"Control plane"} ${m.source?`<span class="chip">${m.source}</span>`:""}</div><pre class="muted" style="white-space:pre-wrap;font-family:inherit;font-size:14px">${esc(m.text)}</pre></div>`).join("")}
          </div>
          <form class="ask" id="ask-form">
            <label class="skip" for="ask">Ask the control plane</label>
            <input id="ask" name="ask" value="${esc(state.ask)}" placeholder="Ask about freshness, drift, or draft a plan" autocomplete="off">
            <button class="btn" type="submit" ${state.busy?"disabled":""}>${state.busy?"Reading…":"Ask"}</button>
          </form>
          <div class="starters">${STARTERS.map(s => `<button type="button" data-starter="${esc(s)}">${esc(s)}</button>`).join("")}</div>
        </section>
        <div style="display:grid;gap:12px">
          <section class="panel">
            <div class="k">Guardrail</div><h2>What I cannot do</h2>
            <ul class="muted" style="margin-top:10px;padding-left:18px;font-size:14px">
              <li>Restart a collector</li><li>Push configuration</li><li>Write NetBox from discovery</li>
              <li>Page on a single signal</li><li>Pretend a stale feed is current</li>
            </ul>
          </section>
          <section class="panel">
            <div class="k">Audit</div><h2>Change plans</h2>
            ${state.plans.length===0 ? `<p class="dim" style="margin-top:10px;font-size:14px">No plans drafted this session. Ask for a check-mode plan.</p>` : `<ul class="list" style="margin-top:10px">${state.plans.map(p => `<li class="cell"><div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:14px">${esc(p.title)}</strong><span class="chip ${p.status==="approved"?"ok":p.status==="rejected"?"crit":"warn"}">${p.status}</span></div>${p.status==="proposed"?`<div class="row"><button class="btn" type="button" data-approve="${p.id}">Approve</button><button class="btn ghost" type="button" data-reject="${p.id}">Reject</button></div>`:`<p class="dim" style="margin-top:8px;font-size:12px">Logged. Execution remains a human.</p>`}</li>`).join("")}</ul>`}
          </section>
        </div>
      </div>
    `;
  }

  function roadmap(){
    const tone = {shipped:"ok", now:"now", next:"warn", planned:""};
    return `
      <div class="eyebrow">Status</div>
      <h1>Where the project actually is</h1>
      <p class="lede">v2.0 shipped. Same rules, a 2026 stack, and the interactions the static page could not demonstrate. v2.1 is the as-code kit.</p>
      <div class="cols4" style="margin-top:22px">
        ${[["Repo","network-observability-architecture"],["Version","2.0"],["Created","2026-07-29"],["License","MIT"]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div style="margin-top:6px;font-weight:650;font-size:15px">${x[1]}</div></div>`).join("")}
      </div>
      <ol style="list-style:none;margin-top:18px;display:grid;gap:10px">${ROADMAP.map(r => `<li class="panel"><div class="row" style="margin:0"><span class="mono accent">v${r[0]}</span><span class="chip ${tone[r[2]]}">${r[2]}</span><span class="chip">${r[1]}</span></div><h2 style="margin-top:8px;font-size:18px">${r[3]}</h2><p class="muted" style="margin-top:8px;font-size:14px">${r[4]}</p></li>`).join("")}</ol>
      <section class="panel" style="margin-top:16px">
        <div class="k">Research folded into v2</div><h2>What 2026 changed</h2>
        <div class="grid2" style="margin-top:12px">
          <div><strong>OpenTelemetry is the interchange</strong><p class="muted" style="font-size:14px;margin-top:4px">OTLP, Grafana Alloy, semantic conventions. Vendor APIs still exist; they get normalized at the edge.</p></div>
          <div><strong>LGTM+ beside Influx</strong><p class="muted" style="font-size:14px;margin-top:4px">Loki, Grafana, Tempo, Mimir, Pyroscope. Tempo traces the pipeline, not the packets.</p></div>
          <div><strong>gNMI and flow</strong><p class="muted" style="font-size:14px;margin-top:4px">SNMP is not gone. Streaming telemetry and IPFIX/sFlow sit next to it. Collectors still do not live on the routers.</p></div>
          <div><strong>NetBox stays intent</strong><p class="muted" style="font-size:14px;margin-top:4px">NetBox Observability and Orb prove the industry agrees: design context first, then telemetry. Discovery does not overwrite SoT.</p></div>
          <div><strong>Adaptive telemetry</strong><p class="muted" style="font-size:14px;margin-top:4px">Cost scales with insight. Freshness SLOs protect the signal; retention tiers protect the bill.</p></div>
          <div><strong>AI stays gated</strong><p class="muted" style="font-size:14px;margin-top:4px">First-party cloud assistants often leave the building. This control plane is read-only, local-context, human approved.</p></div>
        </div>
      </section>
      <h2 style="margin-top:32px">Sibling GESH projects</h2>
      <div class="grid2" style="margin-top:12px">${SUITE.map(s => `<a class="panel" href="${s[2]}" style="color:inherit;text-decoration:none"><div class="k">${s[0]}</div><p class="muted" style="margin-top:8px;font-size:14px">${s[1]}</p></a>`).join("")}</div>
    `;
  }

  const views = {
    "/": command,
    "/pipeline": pipeline,
    "/estate": estate,
    "/drift": drift,
    "/alerts": alerts,
    "/control-plane": plane,
    "/roadmap": roadmap
  };

  function renderChrome(){
    document.getElementById("nav").innerHTML = navHtml();
    document.getElementById("mob").innerHTML = navHtml();
    const s = summary();
    const overall = s.crit ? "crit" : s.warn ? "warn" : "ok";
    document.getElementById("feed-dot").className = "dot "+overall;
    document.getElementById("feed-count").textContent = s.live+"/"+COLLECTORS.length+" feeds";
  }

  function render(){
    renderChrome();
    const fn = views[state.route] || command;
    document.getElementById("view").innerHTML = fn();
    document.title = (NAV.find(n => n[0]===state.route)||[,"Command"])[1] + " · GESH Observability";
    const chat = document.getElementById("chat");
    if(chat) chat.scrollTop = chat.scrollHeight;
    const input = document.getElementById("ask");
    if(input && document.activeElement && document.activeElement.id==="ask") input.focus();
  }

  function patchLive(){
    const s = summary();
    const overall = s.crit ? "crit" : s.warn ? "warn" : "ok";
    const dot = document.getElementById("feed-dot");
    const count = document.getElementById("feed-count");
    if(dot) dot.className = "dot "+overall;
    if(count) count.textContent = s.live+"/"+COLLECTORS.length+" feeds";
    document.querySelectorAll("[data-age]").forEach(el => {
      const id = el.getAttribute("data-age");
      const rt = state.collectors[id];
      if(rt) el.textContent = age(rt.ageSec);
    });
    document.querySelectorAll("[data-health]").forEach(el => {
      el.className = "dot "+health(el.getAttribute("data-health"));
    });
    const live = document.querySelector("[data-kpi=live]");
    const crit = document.querySelector("[data-kpi=crit]");
    const pct = document.querySelector("[data-kpi=pct]");
    if(live){ live.textContent = s.live+"/"+COLLECTORS.length; live.className = "v "+(s.crit?"crit":"ok"); }
    if(crit){ crit.textContent = String(s.crit); crit.className = "v "+(s.crit?"crit":"ok"); }
    if(pct){ pct.textContent = s.pct+"%"; pct.className = "v "+(s.pct<80?"warn":"ok"); }
    const maxIn = Math.max(1, ...COLLECTORS.map(c => state.collectors[c.id].ingest));
    document.querySelectorAll("[data-bar]").forEach(el => {
      const id = el.getAttribute("data-bar");
      el.style.width = Math.round(state.collectors[id].ingest / maxIn * 100)+"%";
    });
    document.querySelectorAll("[data-ing]").forEach(el => {
      el.textContent = String(Math.round(state.collectors[el.getAttribute("data-ing")].ingest));
    });
  }

  document.addEventListener("click", function(e){
    const t = e.target.closest("[data-nav],[data-stage],[data-select],[data-kill],[data-revive],[data-filter],[data-discovery],[data-metric],[data-log],[data-starter],[data-approve],[data-reject],#ham");
    if(!t) return;
    if(t.id==="ham"){
      document.getElementById("chrome").classList.toggle("open");
      t.setAttribute("aria-label", document.getElementById("chrome").classList.contains("open") ? "Close menu" : "Open menu");
      return;
    }
    if(t.hasAttribute("data-nav")){
      const to = t.getAttribute("data-nav");
      if(t.hasAttribute("data-stage")) state.stage = t.getAttribute("data-stage");
      document.getElementById("chrome").classList.remove("open");
      e.preventDefault();
      go(to);
      return;
    }
    if(t.hasAttribute("data-stage")){ state.stage = t.getAttribute("data-stage"); render(); return; }
    if(t.hasAttribute("data-select")){ state.selected = t.getAttribute("data-select"); render(); return; }
    if(t.hasAttribute("data-kill")){
      const id = t.getAttribute("data-kill");
      state.collectors[id].killed = true;
      const spec = COLLECTORS.find(c=>c.id===id);
      pushEvent("crit", spec?spec.name:id, "Heartbeat stopped — feed treated as dead, not quiet");
      render(); return;
    }
    if(t.hasAttribute("data-revive")){
      const id = t.getAttribute("data-revive");
      state.collectors[id].killed = false;
      state.collectors[id].ageSec = 2;
      state.collectors[id].ingest = 24;
      const spec = COLLECTORS.find(c=>c.id===id);
      pushEvent("ok", spec?spec.name:id, "Collector revived — freshness SLO recovering");
      render(); return;
    }
    if(t.hasAttribute("data-filter")){ state.filter = t.getAttribute("data-filter"); render(); return; }
    if(t.hasAttribute("data-discovery")){ state.writeDiscovery = !state.writeDiscovery; render(); return; }
    if(t.hasAttribute("data-metric")){ state.metric = !state.metric; render(); return; }
    if(t.hasAttribute("data-log")){ state.log = !state.log; render(); return; }
    if(t.hasAttribute("data-starter")){ ask(t.getAttribute("data-starter")); return; }
    if(t.hasAttribute("data-approve")){
      const id = t.getAttribute("data-approve");
      state.plans = state.plans.map(p => p.id===id ? Object.assign({}, p, {status:"approved"}) : p);
      pushEvent("ok","control-plane","Change plan "+id+" approved — execution remains human");
      render(); return;
    }
    if(t.hasAttribute("data-reject")){
      const id = t.getAttribute("data-reject");
      state.plans = state.plans.map(p => p.id===id ? Object.assign({}, p, {status:"rejected"}) : p);
      pushEvent("warn","control-plane","Change plan "+id+" rejected — execution remains human");
      render(); return;
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target && e.target.id==="ask-form"){
      e.preventDefault();
      const input = document.getElementById("ask");
      ask(input ? input.value : "");
    }
  });

  window.addEventListener("hashchange", function(){
    routeFromHash();
    render();
    window.scrollTo(0,0);
  });

  routeFromHash();
  render();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
